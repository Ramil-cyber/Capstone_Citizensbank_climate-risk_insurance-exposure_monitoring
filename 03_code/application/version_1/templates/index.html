<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>US County HPI (2026–2030)</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <!-- chroma.js for color scaling -->
  <script src="https://unpkg.com/chroma-js@2.4.2/chroma.min.js"></script>

  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="titleblock">
        <h1>US County Home Price Index</h1>
        <p>Choropleth by county • 2026–2030 • slide years, search ZIP to zoom</p>
      </div>

      <div class="controls">
        <div class="yearbox">
          <div class="yearlabel">
            <span>Year</span>
            <strong id="yearValue">{{ years[0] }}</strong>
          </div>

          <input
            id="yearSlider"
            type="range"
            min="{{ year_min }}"
            max="{{ year_max }}"
            step="1"
            value="{{ years[0] }}"
          />

          <div class="yearbuttons">
            <button id="prevYear" class="btn ghost">◀</button>
            <button id="play" class="btn">Play</button>
            <button id="resetView" class="btn ghost">Reset view</button>
            <button id="backToStates" class="btn ghost" style="display:none;">Back to states</button>
            <button id="nextYear" class="btn ghost">▶</button>
          </div>
        </div>

        <div class="zipbox">
          <label for="zipInput">Zoom to ZIP</label>
          <div class="ziprow">
            <input id="zipInput" placeholder="e.g., 27708" inputmode="numeric" />
            <button id="zipGo" class="btn">Go</button>
          </div>
          <div id="zipStatus" class="status"></div>
        </div>

        <div class="zipbox">
            <label for="countyInput">Zoom to County</label>
            <div class="ziprow">
                <input id="countyInput" placeholder="e.g., Wake, NC" />
                <button id="countyGo" class="btn">Go</button>
            </div>
            <div id="countyStatus" class="status"></div>
        </div>
      </div>
    </header>

    <main class="main">
      <div class="mapcard">
        <div id="map"></div>

        <div class="legendcard">
          <div class="legendtitle">
            <span>HPI scale</span>
            <span id="legendRange" class="muted"></span>
          </div>
          <div id="legendBar" class="legendbar"></div>
          <div class="legendticks">
            <span id="legendMin" class="muted"></span>
            <span id="legendMax" class="muted"></span>
          </div>
        </div>

        <div class="hovercard" id="hoverCard">
          <div class="hovername" id="hoverName">Hover a county</div>
          <div class="hovermeta">
            <span id="hoverFips" class="pill">FIPS: —</span>
            <span id="hoverHpi" class="pill">HPI: —</span>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <span class="muted">Tip: search ZIP to zoom & highlight the county.</span>
    </footer>
  </div>

  <script>
    window.APP_CONFIG = {
      years: {{ years|tojson }},
      yearRanges: {{ year_ranges|tojson }},
      countiesGeojsonUrl: "{{ url_for('serve_counties_geojson') }}",
      apiHpiUrl: "/api/hpi",
      apiZipUrl: "/api/zip_to_county",
      statesGeojsonUrl: "/static/data/states.geojson",
      apiStateHpiUrl: "/api/state_hpi",
    };
  </script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
